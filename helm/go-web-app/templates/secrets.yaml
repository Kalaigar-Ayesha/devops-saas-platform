apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.secrets.name }}
  labels:
    {{- include "go-web-app.labels" . | nindent 4 }}
type: Opaque
data:
  db-host: {{ .Values.secrets.dbHost | b64enc }}
  db-password: {{ .Values.secrets.dbPassword | b64enc }}
  jwt-secret: {{ .Values.secrets.jwtSecret | b64enc }}
  {{- if .Values.secrets.redisPassword }}
  redis-password: {{ .Values.secrets.redisPassword | b64enc }}
  {{- end }}
