replicaCount: 2

image:
  repository: kayesha01/go-web-app
  tag: "latest"
  pullPolicy: IfNotPresent

service:
  type: ClusterIP
  port: 80
  targetPort: 8080

ingress:
  enabled: true
  className: nginx
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
  hosts:
    - host: staging-go-web-app.local
      paths:
        - path: /
          pathType: Prefix
  tls:
    - secretName: go-web-app-staging-tls
      hosts:
        - staging-go-web-app.local

rollingUpdate:
  maxUnavailable: 25%
  maxSurge: 25%

resources:
  limits:
    cpu: 500m
    memory: 512Mi
  requests:
    cpu: 250m
    memory: 256Mi

autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 5
  targetCPUUtilizationPercentage: 70
  targetMemoryUtilizationPercentage: 80

secrets:
  name: app-secrets-staging
  dbHost: "saas-platform-db-staging.cluster-xxx.us-east-1.rds.amazonaws.com"
  dbPassword: "staging-password-456"
  jwtSecret: "staging-jwt-secret-key"

environment: "staging"

podDisruptionBudget:
  enabled: true
  minAvailable: 1

networkPolicy:
  enabled: true
